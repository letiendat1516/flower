<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tặng Eo Eo bó hoa 20/10 💐</title>
  <meta name="description" content="Chúc mừng ngày Phụ nữ Việt Nam 20/10 — một bó hoa rực rỡ gửi sang tận Nhật cho Eo Eo.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tặng Eo Eo bó hoa 20/10 💐">
  <meta property="og:description" content="Chúc mừng ngày Phụ nữ Việt Nam 20/10 — một bó hoa rực rỡ gửi sang tận Nhật cho Eo Eo.">
  <meta name="theme-color" content="#ffd3e2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true"></div>

  <main class="stage">
    <header class="greeting anim">
      <p class="eyebrow">Chúc mừng ngày Phụ nữ Việt Nam</p>
      <h1 class="date">20<span>/</span>10</h1>
      <p class="to">Gửi <span data-cfg="recipient">Em yêu</span> <span class="beat">♥</span></p>
    </header>

    <div class="bouquet-wrap" role="button" tabindex="0" aria-label="Chạm vào bó hoa để thả tim">
      <svg id="bouquet" viewBox="0 60 400 480" role="img" aria-label="Bó hoa hồng, tulip, cúc và oải hương rực rỡ tặng Eo Eo"></svg>
      <div class="sparkles" aria-hidden="true"></div>
    </div>

    <footer class="actions anim">
      <p class="wish" data-cfg="wish"></p>
      <button id="openLetter" class="btn" type="button">Mở thư 💌</button>
      <p class="hint">Chạm vào bó hoa để thả tim nhé ✨</p>
    </footer>
  </main>

  <div class="letter" id="letter" hidden>
    <article class="letter-card" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
      <button class="close" id="closeLetter" type="button" aria-label="Đóng thư">×</button>
      <h2 id="letterTitle" data-cfg="letterTitle"></h2>
      <p id="letterBody" class="letter-body"></p>
      <p class="sign" id="letterSign"><span data-cfg="signOff"></span><br><strong data-cfg="sender"></strong></p>
    </article>
  </div>

  <div class="hearts" aria-hidden="true"></div>

  <script src="assets/js/main.js"></script>
</body>
</html>
